<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Yash 🎂</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: black;
}

/* VIDEO */
#bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

/* INTRO SCREEN */
#intro {
  position: fixed;
  inset: 0;
  z-index: 10;

  display: flex;
  justify-content: center;
  align-items: center;

  background: linear-gradient(
    135deg,
    #07102e,
    #101a4a,
    #02051b
  );
}

/* CARD */
.card {
  width: min(88vw, 440px);
  padding: 30px 22px;
  text-align: center;
  border-radius: 25px;

  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);

  color: white;
}

/* TEXT */
.badge {
  font-size: 14px;
  letter-spacing: 2px;
}

h1 {
  font-size: 55px;
  margin: 15px 0;
}

.subtitle {
  font-size: 20px;
}

.message {
  margin-top: 15px;
  line-height: 1.6;
}

/* BUTTON */
.cta {
  margin-top: 20px;
  padding: 14px 25px;

  border: none;
  border-radius: 30px;

  font-size: 16px;
  font-weight: bold;
  cursor: pointer;

  background: white;
  color: #07102e;
}

/* HIDE INTRO */
.hide {
  display: none !important;
}

</style>
</head>

<body>

<!-- VIDEO -->
<video id="bg" playsinline preload="auto">
  <source src="surprise.mp4" type="video/mp4">
</video>

<!-- INTRO SCREEN -->
<div id="intro">

  <div class="card">

    <div class="badge">
      A LITTLE SURPRISE FOR
    </div>

    <h1>Yash 🎂</h1>

    <div class="subtitle">
      Happy Birthday! ✨
    </div>

    <div class="message">
      May your day be full of smiles,
      beautiful memories and happiness. 💙

      <br><br>

      Keep shining, keep growing,
      and may this new year of your life
      bring lots of success and unforgettable
      moments! 🎉
    </div>

    <button class="cta" id="start">
      ▶ Tap to start the surprise
    </button>

  </div>

</div>

<script>

const video = document.getElementById("bg");
const startButton = document.getElementById("start");
const intro = document.getElementById("intro");

startButton.onclick = function() {

  // Hide intro screen
  intro.classList.add("hide");

  // Start video from 8 seconds
  video.currentTime = 8;

  // Play video at 0.75x speed
  video.playbackRate = 0.75;

  // Play video
  video.play();

};

</script>

</body>
</html>
