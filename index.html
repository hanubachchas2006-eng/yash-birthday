<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For Yash 🎂</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#02051b;color:#fff}
body{display:flex;align-items:center;justify-content:center}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#02051b}
.shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(1,4,28,.22),rgba(1,3,20,.48))}
.stars{position:fixed;inset:0;z-index:2;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#fff 1px,transparent 1px);background-size:83px 83px,127px 127px;background-position:15px 22px,55px 71px;opacity:.35;animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.12}}
.card{position:relative;z-index:3;width:min(88vw,440px);padding:28px 22px 26px;text-align:center;border:1px solid rgba(255,255,255,.18);border-radius:28px;background:rgba(4,7,40,.38);backdrop-filter:blur(8px);box-shadow:0 18px 60px rgba(0,0,0,.38);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.badge{font-size:14px;letter-spacing:3px;text-transform:uppercase;opacity:.9}
h1{font-size:clamp(38px,11vw,62px);margin:8px 0 2px;line-height:1;font-weight:800;text-shadow:0 0 22px rgba(130,180,255,.75)}
.subtitle{font-size:18px;margin:12px auto 8px;line-height:1.5;max-width:360px}
.message{font-size:15px;line-height:1.65;margin:10px auto 18px;opacity:.94}
.cta{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;background:rgba(255,255,255,.92);color:#070a2c;font-weight:750;font-size:15px;box-shadow:0 8px 28px rgba(0,0,0,.3);cursor:pointer}
.hint{font-size:11px;opacity:.7;margin-top:11px}
.confetti{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-12vh;width:8px;height:15px;opacity:.9;animation:fall linear forwards}.piece:nth-child(3n){height:9px;width:12px;border-radius:50%}.piece:nth-child(4n){transform:rotate(45deg)}
@keyframes fall{to{transform:translate3d(var(--x),112vh,0) rotate(720deg);opacity:.15}}
.hidden{display:none!important}
</style>
</head>
<body>
<video id="bg" playsinline loop preload="auto">
  <source src="surprise.mp4" type="video/mp4">
</video>
<div class="shade"></div><div class="stars"></div>
<div class="card">
  <div class="badge">A little surprise for</div>
  <h1>Yash 🎂</h1>
  <div class="subtitle">Happy Birthday! ✨</div>
  <div class="message">May your day be full of smiles, good memories and beautiful moments. Keep shining, keep growing, and may this new year of your life bring you lots of happiness and success. 💙</div>
  <button class="cta" id="start">▶ Tap to start the surprise</button>
  <div class="hint">Turn your volume up 🔊</div>
</div>
<div class="confetti" id="confetti"></div>
<script>
<script>
const v = document.getElementById('bg');
const b = document.getElementById('start');
const c = document.getElementById('confetti');
const card = document.querySelector('.card');
const shade = document.querySelector('.shade');
const stars = document.querySelector('.stars');

function confetti() {
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('i');
    p.className = 'piece';

    p.style.left = Math.random() * 100 + 'vw';
    p.style.setProperty('--x', (Math.random() * 40 - 20) + 'vw');
    p.style.animationDuration = (2.8 + Math.random() * 3.2) + 's';
    p.style.animationDelay = (Math.random() * .8) + 's';
    p.style.opacity = .45 + Math.random() * .55;
    p.style.background = `hsl(${Math.random() * 360},90%,70%)`;

    c.appendChild(p);
    setTimeout(() => p.remove(), 7000);
  }
}

b.addEventListener('click', async () => {

  try {
    await v.play();
  } catch (e) {}

  // Birthday interface hide
  card.classList.add('hidden');

  // Background overlays hide
  shade.classList.add('hidden');
  stars.classList.add('hidden');

  // Confetti effect
  confetti();
});
</script>
</script>
</body>
</html>
